<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f7; margin: 0; padding: 24px; color: #1f2937; }
        .card { background: #ffffff; max-width: 520px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
        .header { background: #6d28d9; color: #ffffff; padding: 24px; }
        .body { padding: 28px; }
        .code { display: block; font-size: 28px; letter-spacing: 6px; font-weight: 700;
                color: #6d28d9; text-align: center; padding: 16px; background: #f4f4f7; border-radius: 8px; }
        .muted { color: #6b7280; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1 style="margin:0;">Réinitialisation de mot de passe</h1>
        </div>
        <div class="body">
            <p>Bonjour{% if first_name %} {{ first_name }}{% endif %},</p>
            <p>Vous avez demandé la réinitialisation de votre mot de passe. Saisissez ce code :</p>
            <span class="code">{{ code }}</span>
            <p class="muted">Ce code expire dans 30 minutes.</p>
            <p class="muted">Si vous n'êtes pas à l'origine de cette demande, ignorez cet email.</p>
        </div>
    </div>
</body>
</html>
